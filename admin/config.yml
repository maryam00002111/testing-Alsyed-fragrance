# ============================================================
#  AL SYED FRAGRANCE — Decap CMS Configuration
#  Accessible at: /admin
# ============================================================

backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:

  - name: "settings"
    label: "⚙️ Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "_data/settings.json"
        fields:
          - label: "Brand Name"
            name: "brand_name"
            widget: "string"
            default: "AL SYED FRAGRANCE"
            hint: "Displayed in the header and footer."

          - label: "Tagline / Slogan"
            name: "tagline"
            widget: "string"
            default: "Our goal is to make premium and well-loved fragrances affordable."

          - label: "Logo"
            name: "logo"
            widget: "image"
            hint: "Upload your logo. Recommended: PNG with transparent background, max 500px wide."
            required: false

          - label: "WhatsApp Order Number"
            name: "whatsapp"
            widget: "string"
            default: "923285760236"
            hint: "Country code + number, no spaces or dashes. E.g. 923285760236"

          - label: "Instagram Handle"
            name: "instagram"
            widget: "string"
            default: "al_syed_fragrance"
            hint: "Without the @ symbol."

          - label: "Facebook Page"
            name: "facebook"
            widget: "string"
            default: "Alsyedfragrance"

          - label: "Contact Email"
            name: "email"
            widget: "string"
            default: "alsyedfragrance85@gmail.com"

  - name: "hero"
    label: "🖼️ Hero / Cover Section"
    files:
      - name: "hero_main"
        label: "Hero Section"
        file: "_data/hero.json"
        fields:
          - label: "Hero Background Image"
            name: "image"
            widget: "image"
            hint: "Upload a wide landscape image (recommended 1920×1080px or larger)."
            required: false

          - label: "Main Headline"
            name: "headline"
            widget: "string"
            default: "AL SYED"
            hint: "Large text displayed in the hero area."

          - label: "Sub-Headline"
            name: "subheadline"
            widget: "string"
            default: "Fragrance"

          - label: "Sub-Text (small)"
            name: "subtext"
            widget: "string"
            default: "Luxury Scents · Timeless Identity · Affordable Elegance"

          - label: "Call-to-Action Button Text"
            name: "cta_text"
            widget: "string"
            default: "Explore Collection"

  - name: "homepage_promotions"
    label: "🎬 Homepage Promotions"
    files:
      - name: "announcement_bar"
        label: "📢 Announcement Bar"
        file: "_data/announcement.json"
        fields:
          - label: "Enable Announcement Bar"
            name: "enabled"
            widget: "boolean"
            default: false
          - label: "Announcement Text"
            name: "text"
            widget: "string"
            default: "AZADI SALE — Up to 30% Off Selected Fragrances"
          - label: "Link URL (optional)"
            name: "link"
            widget: "string"
            required: false
            hint: "Where the bar should link to when clicked. Leave blank for no link."
          - label: "Background Color"
            name: "background_color"
            widget: "string"
            default: "#0A0A0A"
            hint: "Hex or rgba color, e.g. #0A0A0A"
          - label: "Text Color"
            name: "text_color"
            widget: "string"
            default: "#C9A84C"
          - label: "Scrolling Speed (seconds)"
            name: "speed"
            widget: "number"
            value_type: "int"
            default: 18
            hint: "Lower = faster scroll."

      - name: "hero_slider"
        label: "🖼️ Hero Media Slider"
        file: "_data/hero-slider.json"
        fields:
          - label: "Slides"
            name: "slides"
            widget: "list"
            hint: "Add unlimited slides. Drag to reorder or use the Display Order field."
            fields:
              - label: "Media (Image or Video) — Legacy / Fallback"
                name: "media"
                widget: "file"
                required: false
                hint: "Used as a fallback if a device-specific media below is not set. Upload JPG, PNG, WEBP or MP4."
              - label: "Media Type (for legacy media above)"
                name: "media_type"
                widget: "select"
                options:
                  - { label: "Image", value: "image" }
                  - { label: "Video", value: "video" }
                default: "image"
              - label: "🖥️ Desktop Image"
                name: "desktop_image"
                widget: "image"
                required: false
                hint: "Shown on desktop screens. Recommended 1920×1080px or larger."
              - label: "🖥️ Desktop Video"
                name: "desktop_video"
                widget: "file"
                required: false
                hint: "MP4 video for desktop. If set, takes priority over Desktop Image."
              - label: "📱 Tablet Image"
                name: "tablet_image"
                widget: "image"
                required: false
                hint: "Shown on tablet screens. Falls back to Desktop Image if left blank."
              - label: "📱 Tablet Video"
                name: "tablet_video"
                widget: "file"
                required: false
                hint: "MP4 video for tablet. If set, takes priority over Tablet Image."
              - label: "📱 Mobile Image"
                name: "mobile_image"
                widget: "image"
                required: false
                hint: "Shown on mobile screens. Falls back to Desktop Image if left blank."
              - label: "📱 Mobile Video"
                name: "mobile_video"
                widget: "file"
                required: false
                hint: "MP4 video for mobile. If set, takes priority over Mobile Image."
              - label: "Heading"
                name: "heading"
                widget: "string"
                required: false
              - label: "Description"
                name: "description"
                widget: "text"
                required: false
              - label: "Button Text"
                name: "button_text"
                widget: "string"
                required: false
              - label: "Button Link"
                name: "button_link"
                widget: "string"
                required: false
              - label: "Display Order"
                name: "order"
                widget: "number"
                value_type: "int"
                default: 1
              - label: "Enable / Disable"
                name: "enabled"
                widget: "boolean"
                default: true

      - name: "sale_ticker"
        label: "🏷️ Sale Ticker"
        file: "_data/ticker.json"
        fields:
          - label: "Enable Sale Ticker"
            name: "enabled"
            widget: "boolean"
            default: false
          - label: "Background Color"
            name: "background_color"
            widget: "string"
            default: "#111111"
          - label: "Text Color"
            name: "text_color"
            widget: "string"
            default: "#C9A84C"
          - label: "Scrolling Speed (seconds)"
            name: "speed"
            widget: "number"
            value_type: "int"
            default: 22
          - label: "Messages"
            name: "messages"
            widget: "list"
            hint: "Add, edit, delete, and reorder unlimited sale messages."
            fields:
              - label: "Text"
                name: "text"
                widget: "string"
              - label: "Link (optional)"
                name: "link"
                widget: "string"
                required: false
              - label: "Enable / Disable"
                name: "enabled"
                widget: "boolean"
                default: true

  - name: "delivery_settings"
    label: "🚚 Delivery Settings"
    files:
      - name: "delivery"
        label: "Delivery Charges"
        file: "_data/delivery.json"
        fields:
          - label: "Enable Delivery Charges"
            name: "enabled"
            widget: "boolean"
            default: false
          - label: "Delivery Charge Amount (Rs)"
            name: "amount"
            widget: "number"
            value_type: "int"
            default: 250
          - label: "Delivery Charge Label"
            name: "label"
            widget: "string"
            default: "Delivery Charges"
          - label: "Free Delivery Threshold (Rs, optional)"
            name: "free_threshold"
            widget: "number"
            value_type: "int"
            required: false
            hint: "Leave blank to disable free delivery. Orders at or above this subtotal get free delivery."

  - name: "discounts"
    label: "🎁 Discount Settings"
    files:
      - name: "automatic_discount"
        label: "📦 Automatic Discount"
        file: "_data/discount-automatic.json"
        fields:
          - label: "Enable Automatic Discount"
            name: "enabled"
            widget: "boolean"
            default: false
            hint: "⚠️ Coupon Discount will be ignored while Automatic Discount is enabled."
          - label: "Minimum Products Required"
            name: "min_products"
            widget: "number"
            value_type: "int"
            min: 1
            default: 3
          - label: "Discount Percentage"
            name: "percentage"
            widget: "number"
            value_type: "int"
            min: 1
            max: 100
            default: 35
          - label: "Discount Label"
            name: "label"
            widget: "string"
            default: "Buy Any 3 Perfumes & Get 35% OFF"
          - label: "Start Date (optional)"
            name: "start_date"
            widget: "datetime"
            time_format: false
            date_format: "YYYY-MM-DD"
            required: false
            hint: "Leave blank to start immediately."
          - label: "End Date (optional)"
            name: "end_date"
            widget: "datetime"
            time_format: false
            date_format: "YYYY-MM-DD"
            required: false
            hint: "Leave blank for no expiry. Discount stops automatically after this date."

      - name: "coupon_discount"
        label: "🎟 Coupon Discount"
        file: "_data/discount-coupon.json"
        fields:
          - label: "Enable Coupon System"
            name: "enabled"
            widget: "boolean"
            default: false
            hint: "⚠️ Automatic Discount has priority. Disable it to use Coupon Discounts."
          - label: "Coupon Code"
            name: "code"
            widget: "string"
            default: "SAVE20"
            hint: "Not case-sensitive."
          - label: "Minimum Products Required"
            name: "min_products"
            widget: "number"
            value_type: "int"
            min: 1
            default: 2
          - label: "Discount Percentage"
            name: "percentage"
            widget: "number"
            value_type: "int"
            min: 1
            max: 100
            default: 20
          - label: "Coupon Label"
            name: "label"
            widget: "string"
            default: "20% OFF with coupon"
          - label: "Start Date (optional)"
            name: "start_date"
            widget: "datetime"
            time_format: false
            date_format: "YYYY-MM-DD"
            required: false
            hint: "Leave blank to start immediately."
          - label: "End Date (optional)"
            name: "end_date"
            widget: "datetime"
            time_format: false
            date_format: "YYYY-MM-DD"
            required: false
            hint: "Leave blank for no expiry. Coupon stops working automatically after this date."

  - name: "products"
    label: "🧴 Products"
    label_singular: "Product"
    folder: "_data/products"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} — {{category}} — Rs {{price}}"
    sortable_fields: ["name", "category", "price"]
    fields:
      - label: "Product Name"
        name: "name"
        widget: "string"
        hint: "e.g. Oud Royale"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Men", value: "men" }
          - { label: "Women", value: "women" }
          - { label: "New Arrival", value: "new-arrival" }
          - { label: "Deals", value: "bundle" }
          - { label: "Best Seller", value: "best-seller" }
        default: "new-arrival"

      - label: "Also show in (extra categories)"
        name: "extraCats"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "Men", value: "men" }
          - { label: "Women", value: "women" }
          - { label: "New Arrival", value: "new-arrival" }
          - { label: "Deals", value: "bundle" }
          - { label: "Best Seller", value: "best-seller" }
        hint: "Optional. Pick extra categories to show this product in without duplicating it."

      - label: "Product Image"
        name: "image"
        widget: "image"
        hint: "Upload a product photo. Square or portrait (3:4) ratio looks best."
        required: false

      - label: "Price (30ml) — Rs"
        name: "price"
        widget: "number"
        value_type: "int"
        min: 1
        hint: "Price in Pakistani Rupees for the 30ml size."

      - label: "Price (50ml) — Rs"
        name: "price_50"
        widget: "number"
        value_type: "int"
        min: 1
        required: false
        hint: "Leave blank for bundle products or if 50ml is not available."

      - label: "Badge / Label"
        name: "badge"
        widget: "string"
        required: false
        hint: "Optional short badge shown on card, e.g. 'New', 'Popular', '#1 Seller'."

      - label: "Product Description"
        name: "description"
        widget: "text"
        hint: "2–3 sentences describing the scent, notes, and occasion."

      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Uncheck to hide this product without deleting it."
